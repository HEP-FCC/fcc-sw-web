<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

    {% include head.html %}

    <body>

        {% include header.html %}
        <article class="container mt-3 mb-4">
            <div class="mb-4 rounded-3 bg-dark bg-opacity-10" style="border-top: 4px solid #0d6efd;">
                <div class="container-fluid py-3 px-0">
                    <div class="row align-items-center">
                      <div class="col-lg-5 order-lg-2 mb-5 mb-lg-0">
			<picture style="max-width: 75%; display: block; margin-left: auto;">
			  <!-- User prefers light mode: -->
			  <source srcset="assets/img/logo-dark.png" media="(prefers-color-scheme: light)"/>
			  
			  <!-- User prefers dark mode: -->
			  <source srcset="assets/img/FCC-Logo_RGB_White.png"  media="(prefers-color-scheme: dark)"/>
			  
			  <!-- User has no color preference: -->
                            <img class="img-fluid float-lg-end mx-auto d-block"
                                 alt="Future Circular Collider"
                                 src="assets/img/logo-dark.png">
			</picture>
                        </div>
                        <div class="col-lg-7 order-lg-1 ps-4">
                            <h1 class="font-monospace fcc-logo">{{ site.title }}</h1>
                            <p>{{ page.subtitle | default: site.description | strip_html | normalize_whitespace | truncate: 100 | escape }}</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    {{ content }}
                </div>
                <div class="col-lg-3 d-flex flex-column ps-4">
                  <p class="h3">FCC PS&C Meetings</p>
                  <div class="fccsw-meetings-container flex-grow-1">
                    <iframe src="https://fccsw.web.cern.ch/fccsw-meetings/"
                            title="FCC Software Meetings"
                            class="w-100 h-100 border-0"></iframe>
                  </div>
                </div>
            </div>
        </article>
        {% include footer.html %}

    </body>
</html>
