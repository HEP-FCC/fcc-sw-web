<nav aria-label="breadcrumb" class="mb-4">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ '/' | relative_url }}">Home</a></li>
    {% if page.breadcrumb_parent %}
    <li class="breadcrumb-item"><a href="{{ page.breadcrumb_parent.url | relative_url }}">{{ page.breadcrumb_parent.title }}</a></li>
    {% endif %}
    <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
  </ol>
</nav>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var headings = document.querySelectorAll('article h2');
    if (headings.length < 2) return;
    var parts = ['On this page: '];
    headings.forEach(function(h, i) {
      if (!h.id) h.id = h.textContent.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
      if (i > 0) parts.push(' | ');
      parts.push('<a href="#' + h.id + '">' + h.textContent.trim() + '</a>');
    });
    var bar = document.createElement('p');
    bar.className = 'text-muted mb-1';
    bar.innerHTML = parts.join('');
    var hr = document.createElement('hr');
    hr.style.width = '8%';
    hr.style.borderTopWidth = '2px';
    hr.style.borderTopColor = 'var(--bs-link-color)';
    hr.style.opacity = '1';
    hr.className = 'mt-0';
    var h1 = document.querySelector('article h1');
    if (h1) {
      h1.insertAdjacentElement('afterend', hr);
      hr.insertAdjacentElement('beforebegin', bar);
    }
  });
</script>
